server.port=${PORT:3000}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DATABASE_USER:app}
spring.datasource.password=${DATABASE_PASSWORD:app}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jackson.time-zone=UTC
app.jwt.secret=${JWT_SECRET:dev-secret-change-me}
app.jwt.expires-in=${JWT_EXPIRES_IN:3600}
app.cors.origin=${CORS_ORIGIN:*}
app.log.level=${LOG_LEVEL:info}
app.cleanup.cron=${CLEANUP_CRON:*/5 * * * *}
